services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: myuser
      MONGO_INITDB_ROOT_PASSWORD: mypass
      MONGO_INITDB_DATABASE: testdb
    ports:
      - "27017:27017"
    volumes:
        - mongo-data:/data/db
        - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://myuser:mypass@mongodb:27017/"
    ports:
      - "8081:8081"
    depends_on:
      - mongodb

volumes:
  mongo-data:
